name: Build & Release

# Every push to main produces a downloadable release with an auto-incrementing
# version (0.1.<run number>), so the version never has to be bumped by hand.
# Doc-only changes are ignored. You can also trigger a build manually from the
# Actions tab via "Run workflow".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Swoosh $version"

      # Publish the main tray app (single-file) and the WinUI settings app into a
      # "Settings" subfolder next to it, for each architecture. The tray app looks
      # for Swoosh.Settings.exe in that subfolder at runtime.
      - name: Publish win-x64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -o publish/win-x64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-x64 `
            -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-x64/Settings

      - name: Publish win-arm64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -o publish/win-arm64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-arm64 `
            -p:Platform=arm64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-arm64/Settings

      # The self-contained Windows App SDK bundles a large AI/ML runtime the
      # settings app never calls. Drop those native DLLs to keep downloads small.
      - name: Trim unused runtime
        shell: pwsh
        run: |
          $patterns = 'onnxruntime*.dll','Microsoft.AI.MachineLearning*.dll','DirectML*.dll'
          foreach ($rid in 'win-x64','win-arm64') {
            $dir = "publish/$rid/Settings"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -Include $patterns -EA SilentlyContinue |
                ForEach-Object { Write-Host "trim $($_.Name)"; Remove-Item $_.FullName -Force -EA SilentlyContinue }
            }
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path publish/win-x64/*   -DestinationPath "Swoosh-$v-win-x64.zip"   -Force
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "Swoosh-$v-win-arm64.zip" -Force
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Swoosh v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Swoosh-*.zip
