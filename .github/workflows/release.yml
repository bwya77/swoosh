name: Build & Release

# Every push to main produces a downloadable release with an auto-incrementing
# version (0.1.<run number>), so the version never has to be bumped by hand.
# Doc-only changes are ignored. You can also trigger a build manually from the
# Actions tab via "Run workflow".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # sign the build provenance attestation
      attestations: write   # write the build provenance attestation
    # Signing turns on automatically once the AZURE_* secrets exist; until then
    # the sign step is skipped and unsigned builds are published as before.
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Swoosh $version"

      # Publish the main tray app (single-file) and the WinUI settings app into a
      # "Settings" subfolder next to it, for each architecture. The tray app looks
      # for Swoosh.Settings.exe in that subfolder at runtime.
      - name: Publish win-x64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -o publish/win-x64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-x64 `
            -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-x64/Settings

      - name: Publish win-arm64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -o publish/win-arm64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-arm64 `
            -p:Platform=arm64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-arm64/Settings

      # The self-contained Windows App SDK bundles a large AI/ML runtime the
      # settings app never calls. Drop those native DLLs to keep downloads small.
      - name: Trim unused runtime
        shell: pwsh
        run: |
          $patterns = 'onnxruntime*.dll','Microsoft.AI.MachineLearning*.dll','DirectML*.dll'
          foreach ($rid in 'win-x64','win-arm64') {
            $dir = "publish/$rid/Settings"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -Include $patterns -EA SilentlyContinue |
                ForEach-Object { Write-Host "trim $($_.Name)"; Remove-Item $_.FullName -Force -EA SilentlyContinue }
            }
          }

      # Code-sign the launched binaries with Azure Trusted Signing (now "Azure
      # Artifact Signing") so Windows SmartScreen stops warning on download and
      # launch-at-login. Skipped automatically until the AZURE_* secrets and the
      # TRUSTED_SIGNING_* repo variables are configured. Signs before packaging so
      # the published zips contain signed files. Reputation builds over time; the
      # warning clears once enough clean installs accrue against this identity.
      - name: Sign binaries (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path publish/win-x64/*   -DestinationPath "Swoosh-$v-win-x64.zip"   -Force
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "Swoosh-$v-win-arm64.zip" -Force
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      # Publish SHA-256 checksums so users can verify the integrity of a download.
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash Swoosh-*.zip -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Signed SLSA build provenance: lets anyone verify a release zip was built by this
      # repository's CI from this commit, with `gh attestation verify <zip> --repo bwya77/swoosh`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: 'Swoosh-*.zip'

      # Also attach the provenance bundle as a release asset so the provenance is
      # discoverable on the release itself, not only in the attestations store.
      - name: Stage provenance bundle
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "Swoosh-${{ steps.ver.outputs.version }}.intoto.jsonl"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Swoosh v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Swoosh-*.zip
            SHA256SUMS.txt
            Swoosh-*.intoto.jsonl
