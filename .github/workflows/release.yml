name: Build & Release

# A push to main publishes a downloadable release using the version in
# Directory.Build.props (the same version the apps stamp into their binaries and
# show in Settings, so dev builds and releases always match). Bump that version
# to cut a new release; a push whose version was already released just builds and
# validates without republishing. Doc-only changes are ignored. You can also
# trigger a build manually from the Actions tab via "Run workflow".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # sign the build provenance attestation
      attestations: write   # write the build provenance attestation
    # Signing turns on automatically once the AZURE_* secrets exist; until then
    # the sign step is skipped and unsigned builds are published as before.
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Gate the release on the unit tests: if they fail, the job fails here and
      # nothing is published or signed.
      - name: Run tests
        shell: pwsh
        run: dotnet test Swoosh.Tests/Swoosh.Tests.csproj -c Release --nologo

      - name: Compute version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = ([string]$props.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "No <Version> found in Directory.Build.props"; exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Swoosh $version"

          # Only publish when this version has not been released yet, so a push that
          # does not bump the version never overwrites or duplicates a release.
          $null = gh release view "v$version" 2>&1
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Release v$version already exists; building without publishing."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      # Publish the main tray app (single-file) and the WinUI settings app into a
      # "Settings" subfolder next to it, for each architecture. The tray app looks
      # for Swoosh.Settings.exe in that subfolder at runtime.
      - name: Publish win-x64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:UiAccess=true `
            -p:Version=$v -o publish/win-x64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-x64 `
            -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-x64/Settings

      - name: Publish win-arm64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish Swoosh.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:UiAccess=true `
            -p:Version=$v -o publish/win-arm64
          dotnet publish Swoosh.Settings/Swoosh.Settings.csproj -c Release -r win-arm64 `
            -p:Platform=arm64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-arm64/Settings

      # The self-contained Windows App SDK bundles a large AI/ML runtime the
      # settings app never calls. Drop those native DLLs to keep downloads small.
      - name: Trim unused runtime
        shell: pwsh
        run: |
          $patterns = 'onnxruntime*.dll','Microsoft.AI.MachineLearning*.dll','DirectML*.dll'
          foreach ($rid in 'win-x64','win-arm64') {
            $dir = "publish/$rid/Settings"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -Include $patterns -EA SilentlyContinue |
                ForEach-Object { Write-Host "trim $($_.Name)"; Remove-Item $_.FullName -Force -EA SilentlyContinue }
            }
          }

      # Code-sign the launched binaries with Azure Trusted Signing (now "Azure
      # Artifact Signing") so Windows SmartScreen stops warning on download and
      # launch-at-login. Skipped automatically until the AZURE_* secrets and the
      # TRUSTED_SIGNING_* repo variables are configured. Signs before packaging so
      # the published zips contain signed files. Reputation builds over time; the
      # warning clears once enough clean installs accrue against this identity.
      - name: Sign binaries (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Build a Windows installer (Inno Setup) per architecture from the signed publish
      # output. ISCC ships on the runner; install it on the fly if a future image drops it.
      - name: Build installers
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC (Inno Setup) not found" }
          foreach ($arch in 'x64','arm64') {
            & "$iscc" "/DAppVersion=$v" "/DArch=$arch" "/DSourceDir=$env:GITHUB_WORKSPACE\publish\win-$arch" "/O$env:GITHUB_WORKSPACE" "installer\Swoosh.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch" }
          }
          Get-ChildItem SwooshSetup-*.exe | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      # Sign the installer executables so the file users actually double-click is signed.
      - name: Sign installers (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path publish/win-x64/*   -DestinationPath "Swoosh-$v-win-x64.zip"   -Force
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "Swoosh-$v-win-arm64.zip" -Force
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      # Publish SHA-256 checksums so users can verify the integrity of a download.
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash Swoosh-*.zip, SwooshSetup-*.exe -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Signed SLSA build provenance: lets anyone verify a release artifact was built by this
      # repository's CI from this commit, with `gh attestation verify <file> --repo bwya77/swoosh`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            Swoosh-*.zip
            SwooshSetup-*.exe

      # Also attach the provenance bundle as a release asset so the provenance is
      # discoverable on the release itself, not only in the attestations store.
      - name: Stage provenance bundle
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "Swoosh-${{ steps.ver.outputs.version }}.intoto.jsonl"

      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Swoosh v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            SwooshSetup-*.exe
            Swoosh-*.zip
            SHA256SUMS.txt
            Swoosh-*.intoto.jsonl
