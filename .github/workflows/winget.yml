name: Publish to WinGet

# When a release is published, open a pull request to the Windows Package Manager
# Community Repository (microsoft/winget-pkgs) updating BradleyWyatt.Swoosh to the new
# version, using the signed installer assets from the release.
#
# Prerequisites (one-time):
#   1. At least one version of BradleyWyatt.Swoosh must already exist in winget-pkgs
#      (seeded by the initial manual submission).
#   2. A fork of microsoft/winget-pkgs under the bwya77 account.
#   3. A classic PAT with the `public_repo` scope stored as the WINGET_TOKEN secret
#      (fine-grained PATs are not supported by this action).
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: BradleyWyatt.Swoosh
          installers-regex: 'SwooshSetup-.*\.exe$'  # only the installers, not the zips
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
