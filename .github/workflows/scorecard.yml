name: Scorecard

# OpenSSF Scorecard evaluates the repository's supply-chain security posture
# (branch protection, pinned dependencies, token permissions, signing, etc.) and
# uploads the results to the Security tab. The badge in the README reads from the
# public scorecard API.
on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 2'   # weekly Tuesday 04:23 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read             # read repo contents for analysis
      security-events: write     # upload SARIF results to code scanning
      id-token: write            # publish results to the public scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # The default GITHUB_TOKEN can't read branch-protection rules, so the
          # Branch-Protection check is inconclusive. Add a fine-grained PAT with
          # "Administration: read" (+ repo metadata) as the SCORECARD_TOKEN secret to
          # let it score; falls back to the default token until then.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif
