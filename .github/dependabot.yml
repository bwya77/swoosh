version: 2
updates:
  # NuGet packages (the WinUI settings app references Microsoft.WindowsAppSDK).
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/Swoosh.Settings"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Stay on the proven WindowsAppSDK 1.x line; a major (2.x) jump changes the
      # self-contained runtime/packaging and isn't validated by PR checks. Patches
      # and minor updates within the current major still flow through.
      - dependency-name: "Microsoft.WindowsAppSDK"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used in our workflows up to date and patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
